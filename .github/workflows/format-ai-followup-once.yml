name: Temporary format AI follow-up

on:
  push:
    paths:
      - .github/workflows/format-ai-followup-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/ai-decision-reliability'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-decision-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply repository Prettier rules
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/ai/tactics.js src/ai/tactics.test.js src/composables/use-game-ai.js src/composables/use-game-ai.test.js
      - name: Commit formatting
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --exit-code -- frontend/src/ai/tactics.js frontend/src/ai/tactics.test.js frontend/src/composables/use-game-ai.js frontend/src/composables/use-game-ai.test.js; then
            git add frontend/src/ai/tactics.js frontend/src/ai/tactics.test.js frontend/src/composables/use-game-ai.js frontend/src/composables/use-game-ai.test.js
            git commit -m "style(ai): format landlord endgame and wallet-stop changes"
            git push origin HEAD:fix/ai-decision-reliability
          fi
