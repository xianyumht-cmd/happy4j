name: Format login lifecycle sources

on:
  push:
    branches: [fix/login-state-ux-phase1-20261013]
    paths: [.github/workflows/login-code-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format changed source files
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npx prettier --write src/composables/use-game-client.js src/composables/use-game-client.test.js src/components/LobbyHeader.vue src/utils/game-session-state.js src/utils/game-session-state.test.js
          cd ..
          git add frontend/src/composables/use-game-client.js frontend/src/composables/use-game-client.test.js frontend/src/components/LobbyHeader.vue frontend/src/utils/game-session-state.js frontend/src/utils/game-session-state.test.js
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='Happy4J Maintenance' -c user.email='actions@users.noreply.github.com' commit -m 'style(login): normalize frontend lifecycle formatting'
          git push origin HEAD:fix/login-state-ux-phase1-20261013
