name: Login lifecycle regression checks

on:
  push:
    branches: [fix/login-state-ux-phase1-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the original application and run Java and frontend tests
        run: ./gradlew clean test bootJar --no-daemon
      - name: Verify production app bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -s build/libs/happy4j-0.0.1-SNAPSHOT.jar
          jar tf build/libs/happy4j-0.0.1-SNAPSHOT.jar | grep -F 'BOOT-INF/classes/static/index.html'
