name: Windows portable deployment package

on:
  push:
    branches: [fix/ai-decision-reliability]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Run regressions and build application
        run: ./gradlew clean test bootJar --no-daemon
      - name: Check bundled assets and create portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/happy4j-0.0.1-SNAPSHOT.jar
          test -s "$JAR"
          jar tf "$JAR" > build/happy4j-jar-contents.txt
          grep -Fxq 'BOOT-INF/classes/static/index.html' build/happy4j-jar-contents.txt
          grep -Fxq 'BOOT-INF/classes/static/models/douzero_fullauto/landlord.onnx' build/happy4j-jar-contents.txt
          grep -Fxq 'BOOT-INF/classes/static/models/douzero_fullauto/farmer_up.onnx' build/happy4j-jar-contents.txt
          grep -Fxq 'BOOT-INF/classes/db/migration/V8__openai_compatible_ai.sql' build/happy4j-jar-contents.txt
          mkdir -p dist/stage
          cp "$JAR" dist/stage/
          cp deploy/windows/Apply-Update.ps1 deploy/windows/Update.cmd deploy/windows/README-WINDOWS.txt dist/stage/
          (cd dist/stage && sha256sum happy4j-0.0.1-SNAPSHOT.jar > SHA256SUMS.txt)
          {
            echo "repository=xianyumht-cmd/happy4j"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "java=17"
            echo "node=24"
            echo "database_migration_changes=none"
          } > dist/stage/BUILD-INFO.txt
          SHORT_SHA="${GITHUB_SHA:0:10}"
          (cd dist/stage && zip -q -9 -r "../happy4j-windows-portable-${SHORT_SHA}.zip" .)
          ls -lh dist/*.zip "$JAR"
      - uses: actions/upload-artifact@v4
        with:
          name: happy4j-windows-portable-${{ github.sha }}
          path: dist/happy4j-windows-portable-*.zip
          if-no-files-found: error
          retention-days: 14

  windows-verify:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: happy4j-windows-portable-${{ github.sha }}
          path: downloaded
      - name: Verify updater syntax and bundle checksum on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem downloaded -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'No archive available' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath extracted
          $scriptFile = Join-Path (Get-Location) 'extracted\Apply-Update.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptFile, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $jar = Join-Path (Get-Location) 'extracted\happy4j-0.0.1-SNAPSHOT.jar'
          $shaLine = (Get-Content 'extracted\SHA256SUMS.txt' | Select-Object -First 1).Split(' ')[0]
          $actual = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash
          if ($actual -ne $shaLine) { throw 'JAR checksum mismatch' }
          Write-Host 'Windows updater syntax and SHA256 verification passed.'

  preview-release:
    needs: windows-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: happy4j-windows-portable-${{ github.sha }}
          path: packaged
      - name: Publish versioned prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE=$(find packaged -maxdepth 1 -name 'happy4j-windows-portable-*.zip' -type f -print -quit)
          test -n "$FILE"
          SHORT_SHA="${GITHUB_SHA:0:10}"
          TAG="ai-preview-${SHORT_SHA}"
          NOTES="AI reliability preview built from ${GITHUB_SHA}. Validated using Java 17, Node 24, bootJar, bundled frontend/ONNX checks and Windows script verification. Not merged to main. Back up portable MySQL and stop the application's Java process before updating. This is a prerelease; real-game testing remains required."
          gh release create "$TAG" "$FILE" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Happy4J AI preview ${SHORT_SHA}" --notes "$NOTES" --prerelease --latest=false
