name: Format AI fix branch once

on:
  push:
    branches: [fix/ai-decision-reliability]

permissions:
  contents: write

concurrency:
  group: ai-fix-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format files
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx prettier --write src/ai/settlement.js src/ai/settlement.test.js src/ai/tactics.js src/ai/tactics.test.js src/composables/use-game-ai.js src/views/AiView.vue src/components/SettlementDialog.vue
      - name: Commit formatted files
        run: |
          git add frontend
          if ! git diff --cached --quiet; then
            git config user.name "happy4j-ci"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "style(frontend): apply Prettier to AI reliability fixes"
            git push origin HEAD:fix/ai-decision-reliability
          fi
